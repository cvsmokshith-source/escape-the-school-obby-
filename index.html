<h1>🏫 ESCAPE THE SCHOOL!</h1>
    <p>Complete all 25 stages to escape!</p>

    <div class="info">
        <span>Stage: <b id="stage">1</b>/25</span>
        <span>Lives: <b id="lives">3</b></span>
    </div>

    <div id="game">
        <div id="player">🧑</div>
        <div id="obstacle"></div>
        <div id="finish">🏆</div>
    </div>

    <p id="message">Use arrow keys to move!</p>

    <button onclick="restartGame()">Restart</button>

    <script src="script.js"></script>
</body>
</html>
